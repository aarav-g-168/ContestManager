name: Production health
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public health without credentials
        run: curl --fail --silent --show-error --max-time 30 --retry 2 --retry-delay 10 https://contest-manager.vercel.app/api/health
      - name: Check private signals and optional deduplicated alert
        if: always()
        env:
          MONITOR_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$MONITOR_SECRET" ]; then
            curl --fail --silent --show-error --max-time 35 -H "Authorization: Bearer $MONITOR_SECRET" https://contest-manager.vercel.app/api/jobs/monitor
          else
            echo "Optional private monitor not configured. Public health check still runs."
          fi
