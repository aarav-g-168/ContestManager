name: Contest Reminder Scheduler

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

jobs:
  trigger-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Call Reminder API
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL" && test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error --max-time 70 \
            --retry 2 --retry-delay 10 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/jobs/reminders"
